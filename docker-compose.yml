version: '3.8'

services:
  wanderlens:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wanderlens-app
    ports:
      - "3666:3666"
    environment:
      - NODE_ENV=production
      - PORT=3666
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3666"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wanderlens-network

networks:
  wanderlens-network:
    driver: bridge
